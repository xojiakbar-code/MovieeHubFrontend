<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MovieHub - Admin Panel</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    /* Admin panel uchun qo'shimcha */
    .settings-section {
      background: var(--color-surface);
      border-radius: var(--radius-lg);
      padding: 24px;
      margin-bottom: 30px;
      border: 0.5px solid var(--color-border);
    }
    
    .settings-section h3 {
      font-size: 1.1rem;
      font-weight: var(--font-weight-semibold);
      margin-bottom: 16px;
      color: var(--color-text);
    }
    
    .settings-section .form-group {
      margin-bottom: 14px;
    }
    
    .settings-section .btn {
      margin-top: 4px;
    }
    
    .settings-section .success-message {
      color: var(--color-accent-green);
      background: rgba(52, 199, 89, 0.1);
      padding: 10px;
      border-radius: var(--radius-sm);
      margin-top: 10px;
      border: 0.5px solid var(--color-accent-green);
    }
    
    .settings-section .error-message {
      color: var(--color-danger);
      background: rgba(255, 59, 48, 0.1);
      padding: 10px;
      border-radius: var(--radius-sm);
      margin-top: 10px;
      border: 0.5px solid var(--color-danger);
    }
    
    .admin-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: var(--color-surface-raised);
      border-radius: var(--radius-sm);
      margin-bottom: 16px;
      border: 0.5px solid var(--color-border);
    }
    
    .admin-info .label {
      color: var(--color-text-secondary);
      font-size: 0.85rem;
    }
    
    .admin-info .value {
      color: var(--color-text);
      font-weight: var(--font-weight-semibold);
    }
    
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    
    @media (max-width: 768px) {
      .form-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="container">
      <div class="header-content">
        <a href="index.html" class="logo">
          <span>🎬 MovieHub Admin</span>
        </a>
        <button id="logoutBtn" class="logout-btn" style="display:none;">
          🚪 Chiqish
        </button>
      </div>
    </div>
  </header>

  <main class="main-content">
    <div class="container">
      
      <!-- ===== LOGIN FORMA ===== -->
      <div id="loginForm" class="admin-login">
        <h2>🔐 Admin Kirish</h2>
        <form id="loginFormElement">
          <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="Username" required />
          </div>
          <div class="form-group">
            <label for="password">Parol</label>
            <input type="password" id="password" placeholder="Parol" required />
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%;">
            Kirish
          </button>
          <div id="loginError" class="error-message"></div>
        </form>
      </div>

      <!-- ===== ADMIN PANEL ===== -->
      <div id="adminPanel" style="display:none;">
        
        <!-- Admin ma'lumotlari -->
        <div class="admin-info">
          <span>
            <span class="label">👤 Admin:</span>
            <span class="value" id="adminUsernameDisplay">admin</span>
          </span>
          <span>
            <span class="label">🆔 ID:</span>
            <span class="value" id="adminIdDisplay">---</span>
          </span>
        </div>
        
        <!-- ===== SOZLAMALAR (SETTINGS) ===== -->
        <div class="settings-section">
          <h3>⚙️ Sozlamalar</h3>
          
          <form id="settingsForm">
            <div class="form-group">
              <label for="newUsername">Yangi Username</label>
              <input type="text" id="newUsername" placeholder="Yangi username" />
              <small style="color:var(--color-text-tertiary);font-size:0.8rem;">Agar o'zgartirmoqchi bo'lmasangiz, bo'sh qoldiring</small>
            </div>
            
            <div class="form-group">
              <label for="currentPassword">Joriy Parol *</label>
              <input type="password" id="currentPassword" placeholder="Joriy parolingiz" />
            </div>
            
            <div class="form-group">
              <label for="newPassword">Yangi Parol</label>
              <input type="password" id="newPassword" placeholder="Yangi parol" />
              <small style="color:var(--color-text-tertiary);font-size:0.8rem;">Agar o'zgartirmoqchi bo'lmasangiz, bo'sh qoldiring</small>
            </div>
            
            <div class="form-group">
              <label for="confirmNewPassword">Yangi Parolni Tasdiqlang</label>
              <input type="password" id="confirmNewPassword" placeholder="Yangi parolni qayta kiriting" />
            </div>
            
            <button type="submit" class="btn btn-primary">
              💾 Ma'lumotlarni Yangilash
            </button>
            
            <div id="settingsMessage" class="settings-message"></div>
          </form>
        </div>
        
        <hr />
        
        <!-- ===== FILM QO'SHISH ===== -->
        <h2>📽️ Yangi Film/Serial Qo'shish</h2>
        
        <form id="movieForm">
          <!-- Asosiy ma'lumotlar -->
          <div class="form-row">
            <div class="form-group">
              <label for="nomi">Nomi *</label>
              <input type="text" id="nomi" placeholder="Film nomi" required />
            </div>
            <div class="form-group">
              <label for="turi">Turi *</label>
              <select id="turi" required>
                <option value="film">🎬 Film</option>
                <option value="serial">📺 Serial</option>
              </select>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="janr">Janr *</label>
              <input type="text" id="janr" placeholder="Drama, Komediya" required />
            </div>
            <div class="form-group">
              <label for="davlati">Davlat *</label>
              <input type="text" id="davlati" placeholder="AQSh" required />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="yili">Yil *</label>
              <input type="number" id="yili" placeholder="2024" required />
            </div>
            <div class="form-group">
              <label for="tili">Til *</label>
              <input type="text" id="tili" placeholder="Inglizcha" required />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="yoshChegarasi">Yosh chegarasi</label>
              <select id="yoshChegarasi">
                <option value="0+">0+ (Barcha yoshdagilar)</option>
                <option value="6+">6+</option>
                <option value="12+">12+</option>
                <option value="16+">16+</option>
                <option value="18+">18+</option>
              </select>
            </div>
            <div class="form-group">
              <label for="davomiyligi">Davomiyligi *</label>
              <input type="text" id="davomiyligi" placeholder="1soat 40minut" required />
            </div>
          </div>

          <!-- Poster -->
          <div class="form-group">
            <label for="rasm">Poster rasmi URL *</label>
            <input type="text" id="rasm" placeholder="https://i.imgur.com/xxx.jpg" required />
          </div>

          <!-- Film video -->
          <div class="form-group" id="videoField">
            <label for="video">Video URL (film uchun) *</label>
            <input type="text" id="video" placeholder="https://example.com/video.mp4 yoki YouTube embed" required />
          </div>

          <!-- Serial qismlari -->
          <div id="serialFields" style="display:none;">
            <h3 style="margin:20px 0 10px 0;">📺 Serial qismlari</h3>
            <div id="qismlarContainer">
              <div class="qism-item">
                <div class="form-group" style="flex:1;margin:0;">
                  <label>Qism raqami</label>
                  <input type="number" class="qismRaqami" value="1" min="1" />
                </div>
                <div class="form-group" style="flex:2;margin:0;">
                  <label>Video URL</label>
                  <input type="text" class="qismVideo" placeholder="https://example.com/video.mp4 yoki YouTube embed" />
                </div>
                <button type="button" class="btn btn-danger" onclick="this.parentElement.remove()" style="margin-top:18px;">
                  ✕
                </button>
              </div>
            </div>
            <button type="button" id="addQismBtn" class="btn btn-secondary">
              ➕ Qism qo'shish
            </button>
          </div>

          <button type="submit" class="btn btn-primary" style="width:100%;margin-top:20px;">
            💾 Saqlash
          </button>
          
          <div id="formMessage" class="form-message"></div>
        </form>

        <hr />

        <!-- Filmlar ro'yxati -->
        <h2>📋 Barcha Filmlar</h2>
        <div id="moviesList" class="movies-list">
          <!-- JavaScript orqali to'ldiriladi -->
        </div>
        
      </div>
    </div>
  </main>

  <script src="admin.js"></script>
</body>
</html>
