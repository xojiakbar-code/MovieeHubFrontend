<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MovieHub - Admin</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body>
  <header class="header">
    <div class="container">
      <div class="header-content">
        <a href="index.html" class="logo"><i class="fas fa-film"></i><span>MovieHub Admin</span></a>
        <button id="logoutBtn" class="logout-btn" style="display:none;"><i class="fas fa-sign-out-alt"></i> Chiqish</button>
      </div>
    </div>
  </header>

  <main class="main-content">
    <div class="container">
      <!-- Login -->
      <div id="loginForm" class="admin-login">
        <h2><i class="fas fa-lock"></i> Admin Kirish</h2>
        <form id="loginFormElement">
          <div class="form-group"><label>Username</label><input type="text" id="username" required /></div>
          <div class="form-group"><label>Parol</label><input type="password" id="password" required /></div>
          <button type="submit" class="btn btn-primary">Kirish</button>
          <div id="loginError" class="error-message"></div>
        </form>
      </div>

      <!-- Panel -->
      <div id="adminPanel" style="display:none;">
        <h2><i class="fas fa-plus-circle"></i> Yangi Film</h2>
        <form id="movieForm">
          <div class="form-row">
            <div class="form-group"><label>Nomi</label><input type="text" id="nomi" required /></div>
            <div class="form-group"><label>Turi</label><select id="turi" required><option value="film">Film</option><option value="serial">Serial</option></select></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label>Janr</label><input type="text" id="janr" required /></div>
            <div class="form-group"><label>Davlat</label><input type="text" id="davlati" required /></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label>Yil</label><input type="number" id="yili" required /></div>
            <div class="form-group"><label>Til</label><input type="text" id="tili" required /></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label>Yosh chegarasi</label><select id="yoshChegarasi"><option value="0+">0+</option><option value="6+">6+</option><option value="12+">12+</option><option value="16+">16+</option><option value="18+">18+</option></select></div>
            <div class="form-group"><label>Davomiyligi</label><input type="text" id="davomiyligi" required /></div>
          </div>
          <div class="form-group"><label>Poster rasmi</label><input type="text" id="rasm" placeholder="Rasm URL" required /></div>
          <div class="form-group" id="videoField"><label>Video URL</label><input type="text" id="video" placeholder="Video URL" /></div>
          <div id="serialFields" style="display:none;">
            <h3>Qismlar</h3>
            <div id="qismlarContainer">
              <div class="qism-item"><input type="number" class="qismRaqami" value="1" placeholder="Raqam" /><input type="text" class="qismVideo" placeholder="Video URL" /></div>
            </div>
            <button type="button" id="addQismBtn" class="btn btn-secondary"><i class="fas fa-plus"></i> Qism qo'shish</button>
          </div>
          <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Saqlash</button>
          <div id="formMessage" class="form-message"></div>
        </form>

        <hr />
        <h2><i class="fas fa-list"></i> Barcha Filmlar</h2>
        <div id="moviesList" class="movies-list"></div>
      </div>
    </div>
  </main>

  <script src="admin.js"></script>
</body>
</html>
