<!DOCTYPE html>
<html lang="uz">
<head>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3610820986180696"
     crossorigin="anonymous"></script>
  <meta name="monetag" content="2b59fa502a6b938797aecbd474f8b0ac">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MovieHub - Admin Panel</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    /* Admin panel uchun qo'shimcha */
    .qism-item {
      display: flex;
      gap: 12px;
      align-items: flex-end;
      background: var(--color-surface);
      padding: 12px;
      border-radius: var(--radius-sm);
      margin-bottom: 10px;
      border: 1px solid var(--color-border);
    }
    .qism-item .form-group {
      margin-bottom: 0;
    }
    .qism-item .btn-danger {
      padding: 8px 14px;
      font-size: 0.85rem;
    }
    #addQismBtn {
      margin: 10px 0 20px 0;
    }
    .movies-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
      margin-top: 16px;
    }
    .movie-item {
      background: var(--color-surface);
      border-radius: var(--radius-md);
      padding: 12px;
      border: 1px solid var(--color-border);
      transition: border-color var(--duration) var(--ease);
    }
    .movie-item:hover {
      border-color: var(--color-accent);
    }
    .movie-item img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      border-radius: var(--radius-sm);
      margin-bottom: 8px;
    }
    .movie-item h4 {
      font-size: 0.95rem;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .movie-item .movie-actions {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    .movie-item .movie-actions button {
      flex: 1;
      padding: 5px;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 0.8rem;
      cursor: pointer;
      transition: opacity var(--duration) var(--ease);
    }
    .movie-item .movie-actions .edit-btn {
      background: var(--color-accent);
      color: var(--color-bg);
    }
    .movie-item .movie-actions .delete-btn {
      background: var(--color-danger);
      color: #fff;
    }
    .movie-item .movie-actions button:hover {
      opacity: 0.8;
    }
    .form-message.info {
      color: var(--color-text-secondary);
      border: 1px solid var(--color-border);
      background: var(--color-surface);
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="container">
      <div class="header-content">
        <a href="index.html" class="logo">
          <span>🎬 MovieHub Admin</span>
        </a>
        <button id="logoutBtn" class="logout-btn" style="display:none;">
          🚪 Chiqish
        </button>
      </div>
    </div>
  </header>

  <main class="main-content">
    <div class="container">
      
      <!-- ===== LOGIN FORMA ===== -->
      <div id="loginForm" class="admin-login">
        <h2>🔐 Admin Kirish</h2>
        <form id="loginFormElement">
          <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="Username" required />
          </div>
          <div class="form-group">
            <label for="password">Parol</label>
            <input type="password" id="password" placeholder="Parol" required />
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%;">
            Kirish
          </button>
          <div id="loginError" class="error-message"></div>
        </form>
      </div>

      <!-- ===== ADMIN PANEL ===== -->
      <div id="adminPanel" style="display:none;">
        
        <h2>📽️ Yangi Film/Serial Qo'shish</h2>
        
        <form id="movieForm">
          <!-- Asosiy ma'lumotlar -->
          <div class="form-row">
            <div class="form-group">
              <label for="nomi">Nomi *</label>
              <input type="text" id="nomi" placeholder="Film nomi" required />
            </div>
            <div class="form-group">
              <label for="turi">Turi *</label>
              <select id="turi" required>
                <option value="film">🎬 Film</option>
                <option value="serial">📺 Serial</option>
              </select>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="janr">Janr *</label>
              <input type="text" id="janr" placeholder="Drama, Komediya" required />
            </div>
            <div class="form-group">
              <label for="davlati">Davlat *</label>
              <input type="text" id="davlati" placeholder="AQSh" required />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="yili">Yil *</label>
              <input type="number" id="yili" placeholder="2024" required />
            </div>
            <div class="form-group">
              <label for="tili">Til *</label>
              <input type="text" id="tili" placeholder="Inglizcha" required />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="yoshChegarasi">Yosh chegarasi</label>
              <select id="yoshChegarasi">
                <option value="0+">0+ (Barcha yoshdagilar)</option>
                <option value="6+">6+</option>
                <option value="12+">12+</option>
                <option value="16+">16+</option>
                <option value="18+">18+</option>
              </select>
            </div>
            <div class="form-group">
              <label for="davomiyligi">Davomiyligi *</label>
              <input type="text" id="davomiyligi" placeholder="1soat 40minut" required />
            </div>
          </div>

          <!-- Poster -->
          <div class="form-group">
            <label for="rasm">Poster rasmi URL *</label>
            <input type="text" id="rasm" placeholder="https://i.imgur.com/xxx.jpg" required />
          </div>

          <!-- Film video -->
          <div class="form-group" id="videoField">
            <label for="video">Video URL (film uchun) *</label>
            <input type="text" id="video" placeholder="https://example.com/video.mp4 yoki YouTube embed" required />
          </div>

          <!-- Serial qismlari -->
          <div id="serialFields" style="display:none;">
            <h3 style="margin:20px 0 10px 0;">📺 Serial qismlari</h3>
            <div id="qismlarContainer">
              <div class="qism-item">
                <div class="form-group" style="flex:1;margin:0;">
                  <label>Qism raqami</label>
                  <input type="number" class="qismRaqami" value="1" min="1" />
                </div>
                <div class="form-group" style="flex:2;margin:0;">
                  <label>Video URL</label>
                  <input type="text" class="qismVideo" placeholder="https://example.com/video.mp4 yoki YouTube embed" />
                </div>
                <button type="button" class="btn btn-danger" onclick="this.parentElement.remove()" style="margin-top:18px;">
                  ✕
                </button>
              </div>
            </div>
            <button type="button" id="addQismBtn" class="btn btn-secondary">
              ➕ Qism qo'shish
            </button>
          </div>

          <button type="submit" class="btn btn-primary" style="width:100%;margin-top:20px;">
            💾 Saqlash
          </button>
          
          <div id="formMessage" class="form-message"></div>
        </form>

        <hr />

        <!-- Filmlar ro'yxati -->
        <h2>📋 Barcha Filmlar</h2>
        <div id="moviesList" class="movies-list">
          <!-- JavaScript orqali to'ldiriladi -->
        </div>
        
      </div>
    </div>
  </main>

  <script src="admin.js"></script>
</body>
</html>
