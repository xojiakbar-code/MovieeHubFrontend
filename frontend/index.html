<!DOCTYPE html>
<html lang="uz">
<head>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3610820986180696"
     crossorigin="anonymous"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MovieHub - Kino va Seriallar</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body>
  <!-- Loading -->
  <div class="loading-overlay" id="loadingOverlay">
    <div class="loading-spinner"></div>
    <div class="loading-text" id="loadingText">Yuklanmoqda...</div>
  </div>

  <!-- Header -->
  <header class="header">
    <div class="container">
      <div class="header-content">
        <a href="index.html" class="logo">
          <i class="fas fa-film"></i>
          <span>MovieHub</span>
        </a>
        
      <!-- Qidiruv qismi -->
<div class="search-container">
  <div class="search-wrapper">
    <input 
      type="text" 
      id="searchInput" 
      placeholder="Qidirish..." 
      class="search-input"
      autocomplete="off"
    />
    <button id="searchBtn" class="search-btn">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
    </button>
  </div>
  <!-- Takliflar konteyneri -->
  <div class="suggestions-container" id="suggestionsContainer"></div>
</div>
        <a href="admin.html" class="login-btn">
          <i class="fas fa-user-shield"></i>
          <span>Login</span>
        </a>
      </div>
    </div>
  </header>

  <!-- Main -->
  <main class="main-content">
    <div class="container">
      <div class="movies-grid" id="moviesGrid"></div>
    </div>
  </main>

  <!-- Movie Modal -->
  <div class="modal-overlay" id="movieModal">
    <div class="modal-content">
      <button class="modal-close" id="modalClose">&times;</button>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <!-- Age Modal -->
  <div class="modal-overlay" id="ageModal">
    <div class="modal-content age-modal">
      <div class="age-modal-content">
        <h2><i class="fas fa-exclamation-triangle"></i> Yosh chegarasi</h2>
        <p id="ageMessage"></p>
        <div class="age-buttons">
          <button class="age-btn age-btn-yes" id="ageYes">Ha</button>
          <button class="age-btn age-btn-no" id="ageNo">Yo'q</button>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
